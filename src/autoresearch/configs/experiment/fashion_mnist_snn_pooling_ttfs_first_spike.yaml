# @package _global_
defaults:
  - override /dataset: fashion_mnist
  - override /model: snn_pooling_fashion
  - override /optimizer: adamw_snn_pooling
  - override /loss_fn: cross_entropy
  - override /scheduler: cosine_fashion_1pct

experiment_group: fashion_mnist_snn_pooling_ttfs_first_spike
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 60
num_workers: 4
validation_split: 0.1
model:
  encoding: scaled_log_ttfs
  decoding: first_spike
early_stopping:
  enabled: false
hydra:
  sweeper:
    params:
      seed: range(0,5)
wandb:
  tags: [fashion-mnist, snn, pooling, scaled-log-ttfs, first-spike, six-timesteps]
  notes: "Pooling tie-break study; use model overrides for condition selection."
