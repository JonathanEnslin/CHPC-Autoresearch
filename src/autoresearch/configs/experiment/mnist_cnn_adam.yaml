# @package _global_
# MNIST + CNN + Adam baseline

defaults:
  - override /dataset: mnist
  - override /model: cnn
  - override /optimizer: adam
  - override /loss_fn: cross_entropy

experiment_group: mnist_cnn_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 50
num_workers: 4
validation_split: 0.1

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
  metric: val_loss
  mode: min

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - cnn
    - adam
    - cross_entropy
    - baseline
  notes: "Baseline CNN (2 conv + 1 FC) on MNIST"
