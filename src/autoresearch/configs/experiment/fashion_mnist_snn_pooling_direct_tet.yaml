# @package _global_
defaults:
  - override /dataset: fashion_mnist
  - override /model: snn_pooling_fashion
  - override /optimizer: adamw_snn_pooling
  - override /loss_fn: tet_cross_entropy
  - override /scheduler: cosine_fashion_1pct

experiment_group: fashion_mnist_snn_pooling_direct_tet
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 60
num_workers: 4
validation_split: 0.1
early_stopping:
  enabled: false
metrics:
  epoch_frequency: 2
hydra:
  sweeper:
    params:
      seed: range(0,5)
wandb:
  log_frequency: 0
  tags: [fashion-mnist, snn, pooling, direct-input, tet, six-timesteps]
  notes: "Pooling tie-break study; use model overrides for condition selection."
