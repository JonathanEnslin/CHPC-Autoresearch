# @package _global_
# MNIST + FFNN + Adam baseline

defaults:
  - override /dataset: mnist
  - override /model: ffnn
  - override /optimizer: adam
  - override /loss_fn: cross_entropy

experiment_group: mnist_ffnn_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 50
num_workers: 4
validation_split: 0.1

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
  metric: val_loss
  mode: min

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - ffnn
    - adam
    - cross_entropy
    - baseline
  notes: "Baseline FFNN (784-256-128-10) on MNIST"
