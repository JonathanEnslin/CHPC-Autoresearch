iteration: 1
project: snn_pooling_tiebreaks
status: completed
goal: >
  Design a rigorous first experiment suite for convolutional SNN pooling that
  isolates pooling placement and tie-breaking behavior. Specify and validate
  four meaningful conditions: pre-LIF deterministic pooling, post-LIF
  deterministic pooling, post-LIF random tie resolution, and post-LIF
  membrane-excess tie resolution. Define the Fashion-MNIST and CIFAR-10 model
  families, encoding/decoding tracks, training recipes, and activity metrics
  before modifying model code.
created: "2026-07-16"
phases:
  plan:
    started_at: "2026-07-16"
    completed_at: "2026-07-16"
    notes: >
      Project initialized from the human research direction. The key premise is
      that max pooling of binary spikes is an OR operation, so a multi-spike
      window needs an explicit policy for routing the surrogate gradient. The
      initial study will separate effects of pooling placement from effects of
      deterministic, random, and membrane-excess tie-breaking. The detailed
      protocol added on 2026-07-16 fixes six timesteps for all runs; uses two
      Fashion-MNIST tracks (scaled-log TTFS plus first-spike decoding, and
      direct input plus TET); and uses direct input plus TET for CIFAR-10.
      Four conditions replace a nominal 2x3 design because random and
      membrane-based tie policies only have a meaningful interpretation after
      LIF has created binary spikes.
  survey:
    completed_at: "2026-07-16"
    notes: >
      The literature confirms that random tie resolution among simultaneous
      post-spike winners has been used in directly trained SNNs and was
      hypothesized to act as regularization. It also identifies membrane-
      potential-based pooling as a related, underexplored family rather than a
      wholly new operation. The study will therefore state its novelty as a
      controlled, per-timestep comparison of membrane-excess tie-breaking
      against deterministic and random post-spike routing. See literature.yaml
      for sources and implementation consequences.
  implement:
    completed_at: "2026-07-16"
    notes: >
      Implemented a configurable snntorch SNN pooling CNN for both the
      Fashion-MNIST and CIFAR-10 VGG-9 architectures; deterministic, random,
      and membrane-excess post-LIF pooling; pre-LIF deterministic pooling;
      scaled-log TTFS; first-spike and TET decoding; TET loss; cosine and
      warm-up cosine schedules; and per-layer, per-timestep spike and
      tie-routing metrics. The installed snntorch Leaky semantics were checked
      directly: reset_delay=True returns the pre-reset membrane state required
      by membrane-excess pooling. Synthetic tests covered every pooling mode,
      both decoder paths, VGG-9 tensor shapes, temporal loss, and scheduling.
      A bounded two-epoch Fashion-MNIST CUDA smoke test completed successfully
      with checkpointing and realistic chance-level initial metrics.
  experiment:
    started_at: "2026-07-16"
    notes: >
      The first submission (7331850.sched01) failed before training because
      PBS received a CRLF script and rejected /bin/sh^M with exit status 126.
      No seeds ran. The generator has been corrected to write Unix LF before
      resubmitting the same five-seed calibration baseline as 7331887.sched01.
      W&B remained disabled because the private CHPC .env transfer was not
      authorized. The final five-seed baseline was later restarted with
      offline W&B because CHPC cannot reach api.wandb.ai. Job 7332737.sched01
      completed all five direct-encoding, TET, deterministic post-LIF pooling
      runs; its epoch-60 validation accuracy was 89.19% ± 0.78%.
      On 2026-07-17, the next two conditions were submitted concurrently after
      confirming that no other jobs were active: pre-LIF deterministic pooling
      (7334008.sched01) and post-LIF random tie-breaking (7334009.sched01).
      This is the configured two-job maximum; membrane-excess pooling remains
      pending until one of these jobs has finished.
      Pre-LIF deterministic pooling then completed all five seeds in 72
      minutes with 90.95% ± 0.79% final validation accuracy, compared with
      89.19% ± 0.78% for post-LIF deterministic pooling. Its released GPU
      slot was used to submit the membrane-excess condition (7334679.sched01)
      while the random tie-break condition remained active.
      Random post-LIF tie-breaking then completed all five seeds with 89.29%
      ± 0.95% validation accuracy, a negligible +0.10-point difference from
      the deterministic post-LIF baseline under this initial protocol.
      The membrane-excess five-seed job reached its two-hour PBS walltime after
      completing seeds 0–3; seed 4 had no epoch checkpoint, so a single-seed
      one-hour replacement job (7335345.sched01) was submitted.
  analyze:
    started_at: "2026-07-17"
    completed_at: "2026-07-17"
    notes: >
      The deterministic post-LIF Fashion-MNIST baseline is analysis-ready.
      metrics.json records final validation accuracy and best validation loss
      for all five seeds; metrics.jsonl and offline W&B artifacts retain the
      complete two-epoch activity traces for later cross-condition comparison.
      All four direct/TET Fashion-MNIST conditions are now aggregated in
      metrics.json. The primary five-seed statistics retain a catastrophic
      non-convergence in membrane-excess seed 2 rather than omitting it.
  conclude:
    completed_at: "2026-07-17"
    notes: >
      For direct input plus TET on Fashion-MNIST, deterministic max pooling
      before LIF was the strongest tested condition (90.95% ± 0.79%), improving
      1.76 points over deterministic post-LIF pooling (89.19% ± 0.78%). Random
      post-LIF tie-breaking was effectively neutral (89.29% ± 0.95%).
      Membrane-excess pooling was unstable: one of five seeds converged only to
      17.30%, yielding 74.42% ± 31.94% overall; the remaining four seeds
      averaged 88.70% ± 0.61% only as a post-hoc diagnostic. This condition is
      therefore not a viable replacement without a stability intervention.
outcomes:
  - >
    Pre-LIF deterministic pooling is the best direct/TET Fashion-MNIST result
    in this controlled first comparison: 90.95% ± 0.79% across five seeds.
  - >
    Uniform random post-LIF tie-breaking did not improve accuracy relative to
    deterministic post-LIF routing (+0.10 percentage points).
  - >
    Membrane-excess post-LIF routing is presently unstable because one seed
    catastrophically failed to converge; retain all five seeds in the reported
    primary result rather than excluding that outcome.
human_feedback: >
  Fashion-MNIST uses a 32 -> 64 -> 128 Conv-BN-LIF backbone with two variable
  pooling sites and fixed final global average pooling. Train for 60 epochs
  using AdamW (lr 0.02, betas 0.9/0.999, eps 1e-8, wd 1e-4) and cosine decay to
  1% of the initial learning rate. CIFAR-10 starts with a spiking VGG-9 rather
  than SEW-ResNet18 so max-pool behavior is not obscured by residual paths;
  tune only the deterministic post-spike baseline once, then lock the resulting
  recipe across variants. Log per-timestep per-layer raw spike counts and
  normalized firing rates, as well as the number and spatial distribution of
  multi-spike pooling windows and selected winners. Use snntorch's Leaky
  neuron implementation and surrogate gradients throughout; expose the
  pre-reset, post-integration membrane state at variable pool sites for the
  membrane-excess tie-breaker.
