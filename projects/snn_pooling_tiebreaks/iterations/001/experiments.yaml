    status: completed
    notes: >
      Max pooling of convolutional currents before the corresponding LIF
      threshold; ties are ordinary deterministic float max-pool ties. Its
      two-hour allocation is based on the completed 94-minute five-seed
      baseline plus a 20% runtime buffer. W&B is enabled in offline mode and
      the job was submitted as one of at most two active GPU jobs. Startup
      verified at epoch 1: seed 0 has an in-progress status, checkpoint, and
      metrics artifact on its allocated GPU. All five seeds completed at epoch
      60 in 72 minutes; final validation accuracy was 90.95% ± 0.79%.

