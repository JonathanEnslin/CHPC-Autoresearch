iteration: 6
project: snn_pooling_tiebreaks
status: completed
goal: >
  Identify a healthy six-timestep CIFAR-10 deterministic max-pooling SNN
  reference after shared BN and BNTT calibrations both became output-silent.
  Use small, one-seed diagnostic controls to separate output-head starvation
  from the effects of Fashion-MNIST-like neuron/optimisation dynamics before
  rerunning any pooling-policy comparison.
created: "2026-07-18"
phases:
  plan:
    completed_at: "2026-07-18"
    notes: >
      The human requested additional stabilisation experiments after reviewing
      non-collapsing SpikingJelly baselines. Run two concurrent one-seed,
      deterministic post-LIF max-pooling calibrations: a linear-output control
      and a fully spiking, Fashion-like dynamics/optimisation control. Hold
      direct input, six timesteps, CIFAR augmentation, and pooling placement
      fixed. Do not submit the five-policy sweep unless a control is healthy.
  survey:
    completed_at: "2026-07-18"
    notes: >
      Local code comparison established that the non-collapsing Fashion
      first-spike MLP uses a true spiking output, but differs in TTFS drive,
      a leak equivalent to beta about 0.5, ATan surrogate gradients, no biases,
      combined time-batch BN, AdamW/cosine, and norm-5 gradient clipping. The
      non-collapsing CIFAR VGG direct/TET baseline instead uses average pooling
      and a temporal linear readout. The two controls isolate output mode and a
      compact Fashion-like dynamics/optimisation bundle while retaining
      deterministic post-LIF max pooling.
  implement:
    started_at: "2026-07-18"
    completed_at: "2026-07-18"
    notes: >
      Added output-mode, surrogate-kind, and reset-delay controls to the
      snnTorch pooling model. The linear-output control retains all hidden
      spikes and deterministic post-LIF max pooling. The Fashion-like control
      retains the spiking output and pooling policy, while changing beta,
      surrogate, reset timing, optimiser, schedule, and gradient clipping.
      Python syntax and YAML parsing checks passed; a bounded CHPC smoke test
      was submitted before the full calibrations.
  experiment:
    started_at: "2026-07-18"
    notes: >
      The two-configuration, two-epoch CHPC smoke test passed after correcting
      its PBS source path and smoke-only warm-up. Submit the two separate
      one-seed, 200-epoch calibration jobs within the two-GPU-job limit:
      linear output versus fully spiking Fashion-like dynamics.
  analyze:
    completed_at: "2026-07-19"
    notes: >
      Replacing only the output LIF did not prevent failure: the linear-output
      control reached chance performance and zero stage-4 firing by epochs
      80--82. In contrast, the fully spiking Fashion-like control completed
      200 epochs, reached 89.10% peak validation accuracy, and retained
      nonzero deep-layer and output firing. The decisive change is therefore
      not merely the output head; the lower leak, ATan surrogate, immediate
      reset, AdamW/cosine schedule, and clipping bundle establishes a stable
      recipe, although this one-seed calibration cannot attribute causality
      within that bundle.
  conclude:
    completed_at: "2026-07-19"
    notes: >
      The project now has a viable deterministic post-LIF max-pooling CIFAR
      reference under the Fashion-like dynamics/optimisation recipe. Replicate
      that reference across five seeds before using the recipe for the fixed
      pooling-policy comparison; do not compare against the collapsed linear
      output or prior shared-BN/BNTT recipes.
outcomes:
  - >
    Fashion-like fully spiking dynamics stabilised the six-timestep CIFAR
    VGG-9 max-pooling reference, achieving 88.34% final validation accuracy
    and 89.10% peak validation accuracy in its one-seed calibration.
  - >
    A linear output alone is insufficient: its control collapsed with silent
    hidden layers despite retaining deterministic post-LIF max pooling.
human_feedback: >
  Test whether the validated Fashion-MNIST SpikingJelly first-spike design
  reveals a stabilising control for the CIFAR-10 snnTorch VGG-9 reference.
