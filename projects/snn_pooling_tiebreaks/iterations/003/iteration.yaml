iteration: 3
project: snn_pooling_tiebreaks
status: completed
goal: >
  Extend the controlled SNN pooling comparison to Fashion-MNIST scaled-log
  TTFS encoding with first-spike decoding. Compare pre-LIF deterministic
  pooling and four post-LIF policies: deterministic, uniform random,
  greatest membrane threshold excess, and least membrane threshold excess.
  Preserve the established six-timestep Fashion-MNIST CNN and 60-epoch AdamW
  recipe so that input encoding and decoding are the only new experimental
  factors.
created: "2026-07-18"
phases:
  plan:
    completed_at: "2026-07-18"
    notes: >
      The user approved including least-excess in every remaining comparison.
      Direct/TET Fashion-MNIST showed that least-excess was stable but did not
      outperform deterministic post-LIF pooling, whereas greatest-excess had
      a catastrophic non-convergent seed. TTFS/first-spike is the next
      lower-cost generalization track before the larger CIFAR-10 VGG-9 study.
  survey:
    completed_at: "2026-07-18"
    notes: >
      The iteration reuses the pool-placement and tie-routing evidence from
      iteration 1. The only new factor is the already-implemented scaled-log
      TTFS encoder plus first-spike decoder, so no new policy-specific
      literature claim is needed. TET-specific sources are intentionally not
      used to interpret this first-spike track.
  implement:
    started_at: "2026-07-18"
    completed_at: "2026-07-18"
    notes: >
      The existing Fashion-MNIST TTFS/first-spike preset exposes both pooling
      placement and all post-LIF selectors through composable model overrides.
      A two-epoch, two-batch CUDA smoke run completed for post-LIF
      least-excess with scaled-log TTFS and first-spike decoding, producing
      checkpoints and metrics without an execution error. The limited smoke
      is a wiring check, not an accuracy assessment.
  experiment:
    started_at: "2026-07-18"
    completed_at: "2026-07-18"
    notes: >
      Submit one full 60-epoch post-LIF deterministic seed to verify that the
      TTFS/first-spike recipe converges and measure per-seed runtime before
      launching the five-condition, five-seed comparison. The calibration
      completed in about 19 minutes of GPU walltime but failed the health
      gate: validation accuracy stayed at 9.55%, cross-entropy stayed at
      2.302585, and the output LIF emitted no spikes across all six timesteps.
  analyze:
    completed_at: "2026-07-18"
    notes: >
      The final validation firing rates averaged 11.41%, 25.06%, and 25.47%
      in stages 1–3, while every output-timestep rate was exactly zero. This
      is output starvation despite active hidden layers, not an informative
      pooling-policy result.
  conclude:
    completed_at: "2026-07-18"
    notes: >
      The requested scaled-log TTFS plus first-spike Fashion-MNIST track is
      not viable under the fixed direct/TET architecture and threshold recipe.
      The five-condition comparison was correctly withheld: changing pooling
      would be confounded by a non-learning reference model. A future TTFS
      iteration must first calibrate its output threshold/readout or decoder
      while keeping pooling deterministic.
outcomes:
  - >
    The deterministic TTFS/first-spike calibration failed at chance accuracy
    (9.55%) because output-layer spikes were absent throughout training.
  - >
    No TTFS pooling-policy conclusions can be drawn, and the planned
    five-condition expansion was not run.
human_feedback: >
  Include least-excess in all remaining experiments. Commence the remaining
  experiment programme.
