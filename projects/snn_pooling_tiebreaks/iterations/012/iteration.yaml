iteration: 12
project: snn_pooling_tiebreaks
status: experiment
goal: >
  Test non-winner spike regularization with post-LIF greatest-membrane-excess
  pooling on the stable six-timestep direct/TET CIFAR-10 VGG-9 recipe. At each
  pooling site and timestep, penalize all emitted spikes except the greatest-
  excess winner in each 2x2 window.
created: "2026-08-05"
evidence_from_previous_iteration: >
  Iteration 11 completed all five pooling policies without collapse. Greatest-
  excess routing was stable at 88.62% +/- 0.60%, but did not improve accuracy
  over post-LIF deterministic pooling. It is therefore safe to test whether
  directly suppressing non-winning spikes improves sparsity or accuracy.
phases:
  plan:
    completed_at: "2026-08-05"
    notes: >
      Add a mean-normalized regularizer R over pooling sites and timesteps:
      R = mean(spike * (1 - detached_winner_mask)). The greatest-excess winner
      receives zero penalty; a window with no spike or exactly one spike has
      zero regularization. Optimize TET loss plus lambda times R.
    comparison_extension: >
      Compare the viable selective lambda=0.1 condition against ordinary
      all-spike regularization at the same lambda and a zero-penalty control.
      All three retain post-LIF greatest-excess routing; ordinary regularization
      differs only by including the winner in the pre-pool spike penalty.
  survey:
    pending: true
  implement:
    completed_at: "2026-08-05"
    notes: >
      Added greatest-excess winner masks to the post-LIF pooling operator. The
      mask is detached before it gates the live pre-pool spike tensor, so the
      loss has surrogate gradients only through non-winning spikes. Added
      per-site/timestep non-winner activity telemetry, an unweighted training
      loss component, a named regularized CIFAR preset, and focused routing
      tests.
    control_extension_completed_at: "2026-08-06"
    control_extension_notes: >
      Added an ordinary all-pre-pool-spike penalty, plus a no-penalty telemetry
      mode that records the same non-winner statistics. Existing selective
      regularization behavior is retained. Unit tests, Hydra composition, and
      synthetic all/none backward-pass smokes pass locally.
  experiment:
    submitted_at: "2026-08-05"
    notes: >
      Submitted two concurrent 12-hour, sequential two-coefficient jobs after
      a verified local routing/gradient smoke test and synthetic full-VGG
      measurement. Job 7358025 evaluates lambda=0.03 then 0.1; job
      7358026 evaluates lambda=0.3 then 1.0. Both were verified queued in
      gpu_1 immediately after submission.
    completed_at: "2026-08-06"
    completion_notes: >
      Both jobs completed all four 200-epoch calibrations. No condition
      collapsed or starved its deep/output layers. Increasing lambda reduced
      the recorded non-winner rate but worsened accuracy from lambda=0.3
      onward.
    control_comparison_submitted_at: "2026-08-06"
    control_comparison_notes: >
      Job 7358469.sched01 is a packed 12-hour sequential job: first the
      no-regularization telemetry control, then ordinary all-spike
      regularization at lambda=0.1. It was verified queued in gpu_1. The
      previously completed selective non-winner lambda=0.1 run is the third
      matched arm.
  analyze:
    completed_at: "2026-08-06"
    notes: >
      Lambda=0.1 reached 88.26%, essentially identical to the prior
      unregularized same-seed greatest-excess reference (88.28%), while lambda
      0.3 and 1.0 reached 86.14% and 84.48%. Non-winner firing decreased from
      0.7907% at lambda=0.03 to 0.3634% at lambda=1.0. The unregularized
      reference did not record this newly added metric, preventing a direct
      absolute sparsity claim. Do not expand a strong fixed penalty; a future
      warm-up/ramp experiment is the appropriate next test if stronger
      regularization is desired.
    control_comparison_pending: true
  conclude:
    pending: true
coefficient_calibration:
  values: [0.03, 0.1, 0.3, 1.0]
  selection_criteria: >
    Retain a coefficient only if the one-seed run remains clearly above chance,
    keeps nonzero deep/output firing, and reduces non-winner activity relative
    to the completed lambda=0 greatest-excess reference. Choose the largest healthy coefficient for a five-seed
    comparison against unregularized greatest-excess pooling.
  rationale: >
    A synthetic full-VGG forward measured an initial unweighted penalty of
    0.0414, so the earlier 0.001--0.1 proposal would contribute only
    0.00004--0.00414 to an approximately order-one TET loss. The calibrated
    range spans weighted initial penalties of roughly 0.0012--0.0414.
success_metrics:
  - final_validation_accuracy
  - per-site winner and non-winner spike rates
  - regularization_loss
  - stage_4_conv_2_firing_rate
  - output_firing_rate
  - contested_window_rate
