iteration: 4
project: snn_pooling_tiebreaks
status: completed
goal: >
  Establish a healthy one-seed CIFAR-10 direct-input/TET reference for the
  spiking VGG-9 pooling model using deterministic post-LIF pooling. If it
  converges normally, use its runtime and activity profile to launch the
  fixed five-condition comparison: pre-LIF deterministic, post-LIF
  deterministic, post-LIF random, post-LIF greatest-excess, and post-LIF
  least-excess.
created: "2026-07-18"
phases:
  plan:
    completed_at: "2026-07-18"
    notes: >
      Iteration 3 correctly stopped before its TTFS pooling comparison because
      the deterministic reference was output-silent. The project direction
      already specifies the next independent track: CIFAR-10 direct/TET with
      a spiking VGG-9 and a deterministic calibration before comparison.
  survey:
    completed_at: "2026-07-18"
    notes: >
      The existing iteration-1 survey supports low-timestep direct SNN
      training and pooling-policy controls. This iteration changes dataset and
      architecture, not the pooling semantics, and holds TET fixed across the
      planned conditions.
  implement:
    started_at: "2026-07-18"
    completed_at: "2026-07-18"
    notes: >
      The existing CIFAR-10 VGG-9 preset has three explicit 2x2 pool sites,
      direct six-timestep encoding, TET loss, CIFAR augmentation, Nesterov
      SGD, warm-up, and cosine decay. Synthetic CUDA forward/backward checks
      passed for deterministic and least-excess routing. A real local
      two-epoch smoke could not download CIFAR-10 because outbound network is
      blocked, and CHPC currently lacks data/cifar-10-batches-py. Do not
      submit until the dataset archive is placed on CHPC. An existing 173 MB
      CIFAR-10 extraction was then found in the user's CHPC Lustre area and
      copied into this project's data/cifar-10-batches-py directory; the
      required data_batch_1 file was verified.
  experiment:
    started_at: "2026-07-18"
    notes: >
      Submit the deterministic post-LIF, seed-0, 200-epoch calibration with
      the now-available CHPC dataset. Use its observed runtime to size the
      five-seed condition jobs with a 20% buffer. The reference showed early
      learning (28.12% validation accuracy at epoch 3), but collapsed by epoch
      27 to chance-level accuracy with a silent stage-4 and output LIF. It was
      intentionally terminated rather than expanded.
  analyze:
    completed_at: "2026-07-18"
    notes: >
      The collapse is not a data-loading or initial wiring failure: the model
      learned briefly before the deep spiking path became silent. Shared
      BatchNorm across six temporal passes and the post-warm-up 0.1 learning
      rate are leading, untested explanations. BNTT is a justified next
      deterministic-reference intervention, but is not yet an outcome.
  conclude:
    completed_at: "2026-07-18"
    notes: >
      Do not run the five pooling conditions on this VGG-9 recipe. A valid
      deterministic CIFAR reference must first be established; otherwise any
      pooling comparison is confounded by deep-layer output starvation.
outcomes:
  - >
    The CIFAR-10 deterministic VGG-9 calibration was intentionally stopped at
    epoch 27 after deep-layer and output silence caused chance-level results.
  - >
    BNTT should be evaluated first as a deterministic-baseline stabilization
    intervention before retrying CIFAR pooling policies.
human_feedback: >
  Include least-excess in all remaining experiments. Add BNTT as a later
  deterministic-baseline remedy for the failed TTFS/first-spike track.
