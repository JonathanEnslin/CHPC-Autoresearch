iteration: 11
project: snn_pooling_tiebreaks
status: experiment
goal: >
  Compare max-pooling placement and post-LIF tie-break routing on CIFAR-10
  using the validated six-timestep direct/TET spiking VGG-9 recipe. First
  establish one-seed viability for the four untested policies, then use five
  common seeds for every healthy condition.
created: "2026-07-24"
evidence_from_previous_iteration: >
  Iteration 10 completed the deterministic post-LIF reference at 88.87% ±
  0.72% across five seeds. Every run retained active deep and output firing,
  clearing the prerequisite stability gate for this comparison.
phases:
  plan:
    completed_at: "2026-07-24"
    notes: >
      Keep the CIFAR model, augmentation, direct encoding, TET loss, optimizer,
      schedule, six timesteps, and 200-epoch budget fixed. Vary only pooling
      placement/tie-break policy: pre-LIF deterministic, post-LIF random,
      post-LIF greatest membrane excess, and post-LIF least membrane excess.
  survey:
    completed_at: "2026-07-24"
    notes: >
      No new method is introduced. This is the required controlled extension
      of the validated deterministic reference, with explicit routing and
      activity telemetry already implemented.
  implement:
    completed_at: "2026-07-24"
    notes: >
      Added four named presets that keep the validated CIFAR recipe fixed and
      vary only pooling placement/tie-break policy. All four compose under
      Hydra and produce finite 10-class synthetic forwards locally.
  experiment:
    in_progress: true
    notes: >
      Local CIFAR-10 data is unavailable, so policy-specific two-epoch
      data-loader smokes cannot run locally. The unchanged data/model pipeline
      was validated for 200 epochs in iteration 10; synthetic forwards verify
      all routing paths. Submit two one-seed 200-epoch calibrations first,
      respecting the two-job GPU limit.
    startup_validated_at: "2026-07-24"
    startup_notes: >
      The pre-LIF deterministic and post-LIF random calibrations both passed
      startup with meaningful validation accuracy and active stage-4/output
      firing. They may continue to their 200-epoch viability assessments.
    initial_calibrations_completed_at: "2026-07-25"
    initial_calibrations_notes: >
      Both completed healthily: pre-LIF deterministic reached 89.90% and
      post-LIF random reached 88.74% final validation accuracy, retaining
      active deep and output firing. Submit the greatest- and least-excess
      calibrations in the newly available two GPU slots.
    membrane_calibrations_startup_validated_at: "2026-07-26"
    membrane_calibrations_startup_notes: >
      Greatest-excess reached 74.98% by epoch 10 and least-excess reached
      57.46% by epoch 4. Both show nonzero stage-4 and output firing and may
      proceed to their final viability assessment.
    membrane_excess_completed_at: "2026-08-03"
    membrane_excess_notes: >
      The greatest-excess calibration completed healthily at 88.28% final
      validation accuracy, with mean final stage-4 conv-2/output firing of
      1.12%/11.03%. The least-excess calibration checkpointed epoch 199 and
      was killed only by its walltime limit; job 7353326.sched01 resumes it.
    all_calibrations_completed_at: "2026-08-03"
    all_calibrations_notes: >
      The resumed least-excess run completed at 89.04%, retaining 1.13%
      stage-4 conv-2 and 11.01% output firing. All four one-seed policies are
      viable; await human confirmation before launching the five-seed sweep.
    final_sweep_started_at: "2026-08-03"
    final_sweep_notes: >
      Human confirmation received. Measured runtime is roughly 4.25--4.5
      hours per seed, so each 12-hour job runs two complete seeds with a 20%
      buffer. Wave 1 submits pre-LIF deterministic and post-LIF random seeds
      0--1. Later waves complete seeds 2--4 and then run greatest- and
      least-excess, respecting the two-GPU-job cap.
    final_sweep_wave_1_completed_at: "2026-08-03"
    final_sweep_wave_1_notes: >
      Both jobs completed their planned seeds 0--1. Pre-LIF deterministic is
      89.94% +/- 0.06%; post-LIF random is 88.94% +/- 0.28%. Both retain
      active deep/output firing. Jobs 7354661 and 7354662 now run seeds 2--3.
    final_sweep_wave_2_completed_at: "2026-08-04"
    final_sweep_wave_2_notes: >
      Both jobs completed seeds 2--3. Across four seeds, pre-LIF deterministic
      is 90.25% +/- 0.36% and post-LIF random is 89.02% +/- 0.23%, with no
      deep/output activity failure. Jobs 7355062 and 7355063 use observed
      per-policy runtimes to pack the remaining pre/random seeds with the
      first greatest- and least-excess seeds efficiently.
    final_sweep_wave_3_completed_at: "2026-08-04"
    final_sweep_wave_3_notes: >
      The mixed job completed pre-LIF seed 4, random seed 4, and greatest-
      excess seed 0; the least-excess job completed seeds 0--1. Pre-LIF
      deterministic and random now have all five seeds: 90.01% +/- 0.62% and
      88.92% +/- 0.30%. Jobs 7356442 and 7356443 progress the remaining
      membrane-policy seeds in two-seed 12-hour batches.
  analyze:
    pending: true
  conclude:
    pending: true
conditions:
  reference_completed: post_lif_deterministic
  pending_calibrations:
    []
  viable_calibrations:
    - pre_lif_deterministic
    - post_lif_random
    - post_lif_membrane_excess
    - post_lif_membrane_least_excess
calibration_gate: >
  A policy advances only when its one-seed calibration has clearly above-chance
  accuracy and no persistent deep-layer or output silence/saturation. Healthy
  policies then receive a five-seed evaluation with the same fixed recipe.
