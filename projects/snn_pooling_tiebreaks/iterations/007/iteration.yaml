iteration: 7
project: snn_pooling_tiebreaks
status: completed
goal: >
  Test whether scaled-log TTFS input with first-spike decoding is viable under
  the stable six-timestep snnTorch dynamics established in iteration 6, before
  investing in further pooling-policy replications. Run deterministic post-LIF
  max-pooling calibration gates on Fashion-MNIST and CIFAR-10.
created: "2026-07-19"
phases:
  plan:
    completed_at: "2026-07-19"
    notes: >
      The human prioritised other input encodings and networks/datasets over a
      direct/TET Fashion-MNIST replication. Use beta=0.5, ATan surrogate,
      immediate reset, AdamW/cosine, and norm-5 clipping for two single-seed
      deterministic post-LIF gates: Fashion-MNIST TTFS/first-spike (60 epochs)
      uses threshold 0.75, while CIFAR-10 TTFS/first-spike VGG-9 (200 epochs)
      uses threshold 0.5. A two-epoch local Fashion smoke showed that threshold
      1.0 leaves stage 2 initially silent; 0.5 activates every hidden stage
      but is strongly saturated, while 0.75 retains output firing with much
      lower hidden activity. CIFAR must omit normalization because scaled-log
      TTFS requires values in [0, 1].
  survey:
    completed_at: "2026-07-19"
    notes: >
      The encoder requires non-negative samples, so CIFAR uses the same crop
      and flip augmentation as the direct control without normalization. The
      local sparse-drive check selected threshold 0.5 for these first gates.
  implement:
    completed_at: "2026-07-19"
    notes: >
      Added composable stable-dynamics TTFS/first-spike presets for both
      datasets and an unnormalized augmented CIFAR-10 dataset preset. Hydra
      composition passed for both; a local two-epoch Fashion smoke completed.
  experiment:
    started_at: "2026-07-22"
    notes: >
      A sequential, bounded two-epoch smoke was submitted before full
      calibration. It runs Fashion-MNIST and unnormalized CIFAR-10 TTFS/
      first-spike deterministic post-LIF configurations with W&B disabled.
    completed_at: "2026-07-22"
    result: >
      Both bounded jobs completed, but their final validation output firing
      rates were exactly zero at all six timesteps while hidden layers remained
      highly active. The threshold-calibrated direct substitution does not make
      the convolutional TTFS/first-spike path viable, so full Fashion and
      CIFAR calibrations were deliberately not submitted.
  analyze:
    completed_at: "2026-07-22"
    notes: >
      The smoke is sufficient for a negative feasibility gate, not an accuracy
      estimate: two batches produced chance-level validation accuracy and final
      zero output spikes for both datasets. This reproduces the prior output-
      starvation signature despite altering threshold and neuron dynamics.
  conclude:
    completed_at: "2026-07-22"
    notes: >
      Current scaled-log TTFS plus first-spike decoding is not compatible with
      this pooled convolutional snnTorch architecture under six timesteps. A
      future TTFS attempt should change the architecture or output/readout
      mechanism rather than extend this configuration's training budget.
human_feedback: >
  Fashion-MNIST direct/TET is confirmed workable. Prioritise other encodings,
  networks, and datasets.
