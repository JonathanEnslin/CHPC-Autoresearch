sources:
  - citation: "Local snnTorch implementation: src/autoresearch/utils/spike_encoding.py"
    relevance: >
      scaled_log_ttfs_encode creates one deterministic spike per input feature
      but rejects negative input values; CIFAR TTFS therefore needs an
      unnormalized ToTensor transform.
  - citation: "Iteration 6 deterministic CIFAR calibration"
    relevance: >
      The fully spiking beta=0.5/ATan/immediate-reset/AdamW/cosine/clipping
      bundle completed CIFAR-10 at 88.34% final validation accuracy, unlike
      prior shared-BN and BNTT references.
  - citation: "Local iteration 7 Fashion-MNIST TTFS threshold smoke"
    relevance: >
      With beta=0.5 and threshold 1.0, stage 2 was initially silent. A
      threshold-0.5 two-batch smoke activated all three hidden stages and
      produced a nonzero output spike rate at timestep 5, so the CHPC gates
      use threshold 0.5 rather than conflating sparse-drive starvation with
      the encoding comparison.
