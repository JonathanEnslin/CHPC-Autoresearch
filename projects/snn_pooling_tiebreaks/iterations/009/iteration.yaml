iteration: 9
project: snn_pooling_tiebreaks
status: experiment
goal: >
  Establish the full, five-seed Fashion-MNIST thresholded-log TTFS / first-spike
  comparison under the healthy temporal-BN plus projection-LIF bridge. Compare
  pre-LIF deterministic pooling with post-LIF deterministic, random,
  membrane-greatest-excess, and membrane-least-excess routing at six timesteps.
created: "2026-07-23"
phases:
  plan:
    completed_at: "2026-07-23"
    notes: >
      The iteration-8 deterministic bridge calibration completed healthily at
      89.67% final validation accuracy with active output firing at every
      timestep. The user authorised continuation, so this iteration expands
      the controlled comparison while holding that entire recipe fixed.
  survey:
    completed_at: "2026-07-23"
    notes: >
      No new policy mechanism is introduced: the pre-LIF, deterministic,
      random, greatest-excess, and least-excess rules were surveyed and
      directly tested in earlier iterations. The new scientific requirement is
      to hold the now-healthy TTFS bridge fixed while testing those rules.
  implement:
    completed_at: "2026-07-23"
    notes: >
      Added five explicit bridge presets. Each inherits the same six-timestep
      thresholded-log encoder, temporal BN, projection-LIF, bias-free spiking
      readout, optimiser, and decoder; only pooling placement or tie policy
      differs.
  local_validation:
    completed_at: "2026-07-23"
    notes: >
      All five Hydra presets compose. Direct gradient-routing probes confirmed
      that greatest-excess selects the highest active membrane and least-excess
      the lowest active membrane. A bounded two-epoch greatest-excess training
      smoke improved validation accuracy from 10.08% to 30.23%, exercising the
      new temporal-BN bridge and membrane-routing path end-to-end.
  experiment:
    started_at: "2026-07-23"
    notes: >
      The deterministic post-LIF bridge seed from iteration 8 is the already
      healthy reference. Submit one-seed calibrations for pre-LIF deterministic
      and post-LIF greatest-excess first, respecting the two-GPU-job limit.
    startup_validated_at: "2026-07-23"
    startup_notes: >
      Pre-LIF deterministic completed healthily at 89.87% final validation
      accuracy. Greatest-excess reached 86.80% validation accuracy by epoch
      11, with nonzero output activity at every timestep and no saturation
      signature, so both initial calibration paths have passed startup.
    expansion_submitted_at: "2026-07-23"
    expansion_notes: >
      Greatest-excess completed healthily at 89.92% final validation accuracy
      (90.20% peak), without the earlier direct/TET collapse. The random and
      least-excess one-seed bridge calibrations were therefore submitted as the
      complete remaining calibration pair. No five-seed comparison has started.
    second_pair_startup_validated_at: "2026-07-23"
    second_pair_startup_notes: >
      Random completed healthily at 89.83% final validation accuracy. The
      least-excess calibration reached 87.02% validation accuracy by epoch 14
      with active output at all timesteps and non-saturated hidden activity.
    calibrations_completed_at: "2026-07-23"
    calibration_conclusion: >
      All four required one-seed bridge calibrations completed healthily:
      pre-LIF deterministic 89.87%, post-LIF greatest-excess 89.92%, random
      89.83%, and least-excess 89.60% final validation accuracy. Greatest-
      excess is stable in this TTFS bridge despite its direct/TET collapse.
      These values establish viability only; the five-seed comparison awaits
      explicit human confirmation.
    five_seed_comparison_submitted_at: "2026-07-23"
    five_seed_comparison_notes: >
      The human approved expansion. The first two five-seed conditions,
      pre-LIF deterministic and post-LIF deterministic, were submitted with
      identical TTFS bridge settings. Random, greatest-excess, and least-
      excess will be submitted as slots become available, never exceeding two
      active GPU jobs.
  analyze:
    pending: true
  conclude:
    pending: true
human_feedback: >
  Continue with the remaining experiments, including least-excess in all
  remaining post-LIF comparisons.
