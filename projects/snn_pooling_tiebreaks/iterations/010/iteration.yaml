iteration: 10
project: snn_pooling_tiebreaks
status: experiment
goal: >
  Replicate the healthy six-timestep CIFAR-10 direct-input/TET deterministic
  post-LIF max-pooling reference across five seeds. Hold the iteration-6
  Fashion-like dynamics recipe fixed, quantify its accuracy and activity
  variability, and expand to the five pooling policies only if this reference
  remains healthy.
created: "2026-07-23"
phases:
  plan:
    completed_at: "2026-07-23"
    notes: >
      Iteration 6 established a healthy one-seed CIFAR-10 reference: spiking
      VGG-9, direct/TET input at six timesteps, post-LIF deterministic pooling,
      beta 0.5, ATan surrogate, immediate reset, AdamW/cosine, and norm-5
      gradient clipping. The completed Fashion-MNIST TTFS comparison leaves
      this five-seed replication as the next prerequisite for a CIFAR policy
      sweep.
  survey:
    completed_at: "2026-07-23"
    notes: >
      No new pooling method is introduced. The stable recipe and its failure
      controls were already isolated in iteration 6, so this iteration tests
      reproducibility rather than changing model components.
  implement:
    completed_at: "2026-07-23"
    notes: >
      Added a named five-seed preset that exactly inherits the healthy
      iteration-6 Fashion-like dynamics: direct/TET input, deterministic
      post-LIF pooling, beta 0.5, ATan surrogate, immediate reset,
      AdamW/cosine, and norm-5 clipping. Only the experiment-group name and
      W&B metadata differ from the original one-seed control.
  local_validation:
    completed_at: "2026-07-23"
    notes: >
      Hydra composition succeeded in the existing local SNN environment, and
      a synthetic one-sample CPU forward pass returned finite 10-class TET
      logits with the expected shape. CIFAR-10 is not stored locally, so a
      bounded data-loader smoke cannot run here; iteration 6 already supplies
      the full 200-epoch one-seed CHPC validation of this unchanged recipe.
  experiment:
    started_at: "2026-07-23"
    notes: >
      Submit one sequential five-seed, 200-epoch CIFAR-10 deterministic
      reference job with a 20% walltime buffer based on the completed
      iteration-6 calibration. Do not launch a policy sweep until all seeds
      satisfy the activity and accuracy health gate.
    startup_validated_at: "2026-07-23"
    startup_notes: >
      Seed 0 reached 75.26% validation accuracy by epoch 9. Stage-4 conv-2
      firing is nonzero at every timestep (0.42--0.84%), as is output firing
      (14.76--26.05%), so this reproduces the healthy rather than output-silent
      training trajectory at startup.
    continuation_submitted_at: "2026-07-24"
    continuation_notes: >
      The initial 12-hour sequential job was terminated by PBS walltime after
      completing seeds 0--2 and checkpointing seed 3 at epoch 28. A requested
      24-hour continuation was rejected by the queue limit, so a verified
      10-hour continuation was submitted as 7349770.sched01. It completed
      seed 4, but PyTorch 2.6 rejected seed 3's trusted checkpoint because
      torch.load now defaults to weights_only=True while our checkpoint stores
      RNG state. A locally validated weights_only=False loader correction was
      synchronized to CHPC; seed 3 is now recovering alone as 7350183.sched01.
    recovery_startup_validated_at: "2026-07-24"
    recovery_startup_notes: >
      The corrected seed-3 recovery resumed from epoch 28 and wrote an epoch-30
      checkpoint and metric record, confirming that the trusted checkpoint and
      optimizer state restored successfully.
  analyze:
    pending: true
  conclude:
    pending: true
health_gate: >
  Expand only if all five deterministic seeds complete without persistent
  deep-layer/output silence and yield clearly above-chance validation accuracy.
human_feedback: >
  Continue with the next remaining experiments after completing the
  Fashion-MNIST TTFS five-policy comparison.
